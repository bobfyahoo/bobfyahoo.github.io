name: Deploy Polyglot Site

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Angular
        run: |
          cd angular-app
          npm install
          npx ng build --base-href ./

      - name: Build ReactVite
        run: |
          cd react-app
          npm install
          npm run build

      - name: Build VueVite
        run: |
          cd vue-app
          npm install
          npm run build

      - name: Assemble Final Site
        run: |
          mkdir -p final_dist/angular
          cp -r public/* final_dist/
          cp -r angular-app/dist/angular-app/browser/* final_dist/angular/
          cp -r react-app/dist/assets final_dist
          cp -r react-app/dist/index.html final_dist/react.html
          cp -r vue-app/dist/assets final_dist
          cp -r vue-app/dist/index.html final_dist/vue.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4