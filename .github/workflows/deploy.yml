name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Angular
        run: |
          cd angular-app
          npm install
          npx ng build --base-href ./ 

      - name: Assemble Site
        run: |
          mkdir -p dist
          cp -r public/* dist/
          mkdir -p dist/angular
          cp -r angular-app/dist/angular-app/browser/* dist/angular/

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4