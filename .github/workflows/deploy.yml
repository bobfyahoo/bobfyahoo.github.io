name: Deploy Polyglot Site
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Angular
        run: |
          cd angular-app
          npm install
          npx ng build --base-href ./
      - name: Prepare Files
        run: |
          mkdir -p dist/angular
          cp -r public/* dist/
          cp -r angular-app/dist/angular-app/browser/* dist/angular/
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        uses: actions/deploy-pages@v4