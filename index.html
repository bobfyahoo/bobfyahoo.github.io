<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Framework Ticket Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-edit { cursor: pointer; background-color: #0d6efd; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; }
        .badge-delete { cursor: pointer; background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; }
        .tab-content { border: 1px solid #dee2e6; border-top: none; padding: 20px; background: #fff; }
        .rich-preview { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-top: 5px; min-height: 50px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Ticket Manager</h2>
    
    <ul class="nav nav-tabs" id="frameworkTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" id="react-tab" data-bs-toggle="tab" data-framework="react">React</button></li>
        <li class="nav-item"><button class="nav-link" id="angular-tab" data-bs-toggle="tab" data-framework="angular">Angular</button></li>
        <li class="nav-item"><button class="nav-link" id="vue-tab" data-bs-toggle="tab" data-framework="vue">Vue</button></li>
        <li class="nav-item"><button class="nav-link" id="jquery-tab" data-bs-toggle="tab" data-framework="jquery">jQuery</button></li>
    </ul>

    <div class="tab-content" id="mount-point">
        </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Confirm Delete</h5></div>
            <div class="modal-body">Are you sure you want to remove item?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Remove</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
/** * SHARED IN-MEMORY STORE
 */
const SharedStore = {
    tickets: [
        { id: 1, summary: 'Setup GitHub Pages', description: 'Initial deployment', assignee: 'Robert', status: 'Open', created: new Date().toLocaleString() }
    ],
    assignees: ['Robert', 'Sarah', 'James', 'Elena', 'Hiro', 'Chloe'],
    statuses: ['Open', 'In-Progress', 'Resolved', 'Re-opened', 'Tested', 'Deployed', 'Closed'],
    
    save(data) {
        if (data.id) {
            const index = this.tickets.findIndex(t => t.id === data.id);
            this.tickets[index] = { ...data };
        } else {
            this.tickets.push({ ...data, id: Date.now(), created: new Date().toLocaleString() });
        }
    },
    remove(id) {
        this.tickets = this.tickets.filter(t => t.id !== id);
    }
};

/**
 * UTILITY: Router/Switcher
 */
document.querySelectorAll('[data-framework]').forEach(tab => {
    tab.addEventListener('shown.bs.tab', (e) => {
        const framework = e.target.getAttribute('data-framework');
        initFramework(framework);
    });
});

function initFramework(name) {
    const container = document.getElementById('mount-point');
    container.innerHTML = ''; // Clear previous
    if (name === 'react') renderReact(container);
    if (name === 'vue') renderVue(container);
    if (name === 'jquery') renderJQuery(container);
    if (name === 'angular') container.innerHTML = '<div class="alert alert-info">Angular typically requires a build step for its current version (Signals/Standalone). In this CDN demo, please use Vue or React tabs for the full logic!</div>';
}

/**
 * REACT IMPLEMENTATION
 */
function renderReact(container) {
    const { useState, useEffect } = React;

    const App = () => {
        const [view, setView] = useState('list');
        const [editing, setEditing] = useState(null);
        const [data, setData] = useState([...SharedStore.tickets]);

        const handleSave = (ticket) => {
            SharedStore.save(ticket);
            setData([...SharedStore.tickets]);
            setView('list');
        };

        const handleDelete = (id) => {
            const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
            document.getElementById('btn-confirm-delete').onclick = () => {
                SharedStore.remove(id);
                setData([...SharedStore.tickets]);
                modal.hide();
            };
            modal.show();
        };

        if (view === 'form') return React.createElement(TicketForm, { 
            item: editing, 
            onSave: handleSave, 
            onCancel: () => setView('list') 
        });

        return React.createElement('div', null, 
            React.createElement('button', { className: 'btn btn-primary mb-3', onClick: () => { setEditing(null); setView('form'); }}, 'Add Ticket'),
            React.createElement(TicketTable, { tickets: data, onEdit: (t) => { setEditing(t); setView('form'); }, onDelete: handleDelete })
        );
    };

    const TicketTable = ({ tickets, onEdit, onDelete }) => (
        React.createElement('table', { className: 'table' },
            React.createElement('thead', null, React.createElement('tr', null, 
                ['Summary', 'Assignee', 'Status', 'Actions'].map(h => React.createElement('th', { key: h }, h))
            )),
            React.createElement('tbody', null, tickets.map(t => 
                React.createElement('tr', { key: t.id },
                    React.createElement('td', null, t.summary),
                    React.createElement('td', null, t.assignee),
                    React.createElement('td', null, React.createElement('span', { className: 'badge bg-secondary' }, t.status)),
                    React.createElement('td', { className: 'text-end' },
                        React.createElement('a', { className: 'badge-edit me-2', onClick: () => onEdit(t) }, 'Edit'),
                        React.createElement('a', { className: 'badge-delete', onClick: () => onDelete(t.id) }, 'Delete')
                    )
                )
            ))
        )
    );

    const TicketForm = ({ item, onSave, onCancel }) => {
        const [form, setForm] = useState(item || { summary: '', description: '', assignee: 'Robert', status: 'Open' });
        
        return React.createElement('form', { onSubmit: (e) => { e.preventDefault(); onSave(form); }},
            React.createElement('div', { className: 'mb-3' },
                React.createElement('label', null, 'Summary (Max 50)'),
                React.createElement('input', { 
                    className: 'form-control', 
                    value: form.summary, 
                    maxLength: 50, 
                    required: true,
                    onChange: e => setForm({...form, summary: e.target.value})
                })
            ),
            React.createElement('div', { className: 'mb-3' },
                React.createElement('label', null, 'Description (MD/HTML supported)'),
                React.createElement('textarea', { 
                    className: 'form-control', 
                    value: form.description, 
                    maxLength: 500, 
                    required: true,
                    onChange: e => setForm({...form, description: e.target.value})
                }),
                React.createElement('div', { 
                    className: 'rich-preview', 
                    dangerouslySetInnerHTML: { __html: marked.parse(form.description || '') } 
                })
            ),
            React.createElement('div', { className: 'mb-3' },
                React.createElement('label', null, 'Assignee'),
                React.createElement('select', { className: 'form-select', value: form.assignee, onChange: e => setForm({...form, assignee: e.target.value})},
                    SharedStore.assignees.map(a => React.createElement('option', { key: a, value: a }, a))
                )
            ),
            React.createElement('button', { type: 'submit', className: 'btn btn-success me-2' }, 'Save'),
            React.createElement('button', { type: 'button', className: 'btn btn-light', onClick: onCancel }, 'Cancel')
        );
    };

    const root = ReactDOM.createRoot(container);
    root.render(React.createElement(App));
}

/**
 * JQUERY IMPLEMENTATION
 */
function renderJQuery(container) {
    const $c = $(container);
    
    function refresh() {
        $c.empty();
        $c.append('<button class="btn btn-primary mb-3" id="jq-add">Add Ticket (jQuery)</button>');
        const $table = $('<table class="table"><thead><tr><th>Summary</th><th>Assignee</th><th>Status</th><th>Actions</th></tr></thead><tbody></tbody></table>');
        
        SharedStore.tickets.forEach(t => {
            const $row = $(`<tr>
                <td>${t.summary}</td>
                <td>${t.assignee}</td>
                <td><span class="badge bg-secondary">${t.status}</span></td>
                <td class="text-end">
                    <a class="badge-edit me-2 btn-edit" data-id="${t.id}">Edit</a>
                    <a class="badge-delete btn-delete" data-id="${t.id}">Delete</a>
                </td>
            </tr>`);
            $table.find('tbody').append($row);
        });
        $c.append($table);
    }

    $c.on('click', '#jq-add', () => alert('jQuery Tab: Logic shared via Store object!'));
    $c.on('click', '.btn-delete', function() {
        const id = $(this).data('id');
        const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        $('#btn-confirm-delete').off().on('click', () => {
            SharedStore.remove(id);
            modal.hide();
            refresh();
        });
        modal.show();
    });

    refresh();
}

/**
 * VUE IMPLEMENTATION
 */
function renderVue(container) {
    const { createApp, ref, computed } = Vue;
    createApp({
        setup() {
            const tickets = ref(SharedStore.tickets);
            const view = ref('list');
            const form = ref({});
            
            const save = () => {
                SharedStore.save(form.value);
                view.value = 'list';
            };
            
            const edit = (t) => {
                form.value = { ...t };
                view.value = 'form';
            };

            const preview = computed(() => marked.parse(form.value.description || ''));

            return { tickets, view, form, save, edit, preview, assignees: SharedStore.assignees };
        },
        template: `
            <div v-if="view === 'list'">
                <button @click="view='form'; form={assignee:'Robert'}" class="btn btn-primary mb-3">Add Ticket (Vue)</button>
                <table class="table">
                    <tr v-for="t in tickets">
                        <td>{{t.summary}}</td>
                        <td>{{t.assignee}}</td>
                        <td><span class="badge bg-secondary">{{t.status}}</span></td>
                        <td class="text-end">
                            <a class="badge-edit me-2" @click="edit(t)">Edit</a>
                        </td>
                    </tr>
                </table>
            </div>
            <div v-else>
                <input v-model="form.summary" class="form-control mb-2" placeholder="Summary" required maxlength="50">
                <textarea v-model="form.description" class="form-control mb-2" placeholder="Description"></textarea>
                <div class="rich-preview mb-2" v-html="preview"></div>
                <select v-model="form.assignee" class="form-select mb-2">
                    <option v-for="a in assignees">{{a}}</option>
                </select>
                <button @click="save" class="btn btn-success">Save</button>
            </div>
        `
    }).mount(container);
}

// Default Start
initFramework('react');
</script>
</body>
</html>
