<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework Cross-Play: Jira Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-btn { cursor: pointer; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; }
        .preview-box { border: 1px solid #dee2e6; padding: 10px; min-height: 80px; background: #f9f9f9; border-radius: 5px; }
        .nav-link { cursor: pointer; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Ticket Manager</h2>
    
    <ul class="nav nav-tabs mb-4" id="frameworkTabs">
        <li class="nav-item"><a class="nav-link active" data-framework="react">React</a></li>
        <li class="nav-item"><a class="nav-link" data-framework="angular">Angular</a></li>
        <li class="nav-item"><a class="nav-link" data-framework="vue">Vue</a></li>
        <li class="nav-item"><a class="nav-link" data-framework="jquery">jQuery</a></li>
    </ul>

    <div id="mount-point" class="p-4 bg-white border border-top-0 rounded-bottom"></div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">Are you sure you want to remove item?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDelete">Remove</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
/** * 1. SHARED DATA STORE
 */
const TicketStore = {
    items: [],
    assignees: ['Robert', 'Sarah', 'James', 'Elena', 'Hiro', 'Chloe'],
    statuses: ['Open', 'In-Progress', 'Resolved', 'Re-opened', 'Tested', 'Deployed', 'Closed'],
    
    save(ticket) {
        const timestamp = new Date().toLocaleString();
        if (ticket.id) {
            const idx = this.items.findIndex(t => t.id === ticket.id);
            this.items[idx] = { ...ticket, updated: timestamp };
        } else {
            const newItem = { ...ticket, id: Date.now(), created: timestamp, updated: timestamp };
            this.items.push(newItem);
        }
    },
    remove(id) {
        this.items = this.items.filter(t => t.id !== id);
    }
};

/**
 * 2. REACT IMPLEMENTATION (Functional / Idiomatic)
 */
const { useState, useEffect } = React;

function ReactApp() {
    const [view, setView] = useState('list'); // 'list' or 'form'
    const [currentEdit, setCurrentEdit] = useState(null);
    const [tickets, setTickets] = useState([...TicketStore.items]);

    const openForm = (ticket = null) => { setCurrentEdit(ticket); setView('form'); };
    
    const handleDelete = (id) => {
        const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
        document.getElementById('confirmDelete').onclick = () => {
            TicketStore.remove(id);
            setTickets([...TicketStore.items]);
            modal.hide();
        };
        modal.show();
    };

    if (view === 'form') return React.createElement(TicketForm, { 
        ticket: currentEdit, 
        onSave: (data) => { TicketStore.save(data); setTickets([...TicketStore.items]); setView('list'); },
        onCancel: () => setView('list')
    });

    return React.createElement('div', null,
        React.createElement('button', { className: 'btn btn-primary mb-3', onClick: () => openForm() }, 'Add Ticket'),
        React.createElement(TicketTable, { tickets, onEdit: openForm, onDelete: handleDelete })
    );
}

function TicketTable({ tickets, onEdit, onDelete }) {
    return React.createElement('table', { className: 'table align-middle' },
        React.createElement('thead', null, React.createElement('tr', null, 
            ['Summary', 'Assignee', 'Status', 'Actions'].map(h => React.createElement('th', { key: h }, h))
        )),
        React.createElement('tbody', null, tickets.map(t => React.createElement('tr', { key: t.id },
            React.createElement('td', null, t.summary),
            React.createElement('td', null, t.assignee),
            React.createElement('td', null, React.createElement('span', { className: 'badge bg-info text-dark' }, t.status)),
            React.createElement('td', null, 
                React.createElement('button', { className: 'btn btn-sm btn-outline-primary me-1', onClick: () => onEdit(t) }, 'Edit'),
                React.createElement('button', { className: 'btn btn-sm btn-outline-danger', onClick: () => onDelete(t.id) }, 'Delete')
            )
        )))
    );
}

function TicketForm({ ticket, onSave, onCancel }) {
    const [state, setState] = useState(ticket || { summary: '', description: '', assignee: 'Robert', status: 'Open' });
    
    return React.createElement('form', { onSubmit: (e) => { e.preventDefault(); onSave(state); }},
        React.createElement('div', { className: 'mb-3' }, 
            React.createElement('label', null, 'Summary'),
            React.createElement('input', { className: 'form-control', maxLength: 50, required: true, value: state.summary, onChange: e => setState({...state, summary: e.target.value})})
        ),
        React.createElement('div', { className: 'mb-3' }, 
            React.createElement('label', null, 'Description'),
            React.createElement('textarea', { className: 'form-control', maxLength: 500, required: true, value: state.description, onChange: e => setState({...state, description: e.target.value})}),
            React.createElement('div', { className: 'preview-box mt-2', dangerouslySetInnerHTML: { __html: marked.parse(state.description || '') } })
        ),
        React.createElement('div', { className: 'row mb-3' },
            React.createElement('div', { className: 'col' }, 
                React.createElement('label', null, 'Assignee'),
                React.createElement('select', { className: 'form-select', value: state.assignee, onChange: e => setState({...state, assignee: e.target.value})}, 
                    TicketStore.assignees.map(a => React.createElement('option', { key: a }, a))
                )
            ),
            React.createElement('div', { className: 'col' }, 
                React.createElement('label', null, 'Status'),
                React.createElement('select', { className: 'form-select', value: state.status, onChange: e => setState({...state, status: e.target.value})}, 
                    TicketStore.statuses.map(s => React.createElement('option', { key: s }, s))
                )
            )
        ),
        React.createElement('button', { type: 'submit', className: 'btn btn-success me-2' }, 'Save'),
        React.createElement('button', { type: 'button', className: 'btn btn-secondary', onClick: onCancel }, 'Cancel')
    );
}

/**
 * 3. VUE IMPLEMENTATION (Composition API)
 */
const VueApp = {
    setup() {
        const tickets = Vue.ref([...TicketStore.items]);
        const view = Vue.ref('list');
        const form = Vue.ref({});

        const openForm = (t = null) => { form.value = t ? { ...t } : { summary:'', description:'', assignee:'Robert', status:'Open' }; view.value = 'form'; };
        const save = () => { TicketStore.save(form.value); tickets.value = [...TicketStore.items]; view.value = 'list'; };
        const remove = (id) => {
            const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
            document.getElementById('confirmDelete').onclick = () => { TicketStore.remove(id); tickets.value = [...TicketStore.items]; modal.hide(); };
            modal.show();
        };

        return { tickets, view, form, openForm, save, remove, assignees: TicketStore.assignees, statuses: TicketStore.statuses, 
                 renderMd: (txt) => marked.parse(txt || '') };
    },
    template: `
        <div v-if="view === 'list'">
            <button class="btn btn-primary mb-3" @click="openForm()">Add Ticket</button>
            <table class="table">
                <tr v-for="t in tickets" :key="t.id">
                    <td>{{t.summary}}</td><td>{{t.assignee}}</td>
                    <td><span class="badge bg-info text-dark">{{t.status}}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" @click="openForm(t)">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" @click="remove(t.id)">Delete</button>
                    </td>
                </tr>
            </table>
        </div>
        <form v-else @submit.prevent="save">
            <input v-model="form.summary" class="form-control mb-2" placeholder="Summary" required maxlength="50">
            <textarea v-model="form.description" class="form-control mb-2" maxlength="500"></textarea>
            <div class="preview-box mb-2" v-html="renderMd(form.description)"></div>
            <select v-model="form.assignee" class="form-select mb-2"><option v-for="a in assignees">{{a}}</option></select>
            <select v-model="form.status" class="form-select mb-3"><option v-for="s in statuses">{{s}}</option></select>
            <button class="btn btn-success me-2">Save</button>
            <button type="button" class="btn btn-secondary" @click="view='list'">Cancel</button>
        </form>
    `
};

/**
 * 4. JQUERY IMPLEMENTATION
 */
function renderJQuery() {
    const $m = $('#mount-point').html('<button class="btn btn-primary mb-3" id="jq-add">Add Ticket</button><div id="jq-table"></div>');
    const refresh = () => {
        let h = '<table class="table"><tr><th>Summary</th><th>Actions</th></tr>';
        TicketStore.items.forEach(t => h += `<tr><td>${t.summary}</td><td>
            <button class="btn btn-sm btn-primary jq-edit" data-id="${t.id}">Edit</button>
            <button class="btn btn-sm btn-danger jq-del" data-id="${t.id}">Delete</button>
        </td></tr>`);
        $('#jq-table').html(h + '</table>');
    };
    $m.on('click', '#jq-add', () => alert("jQuery logic shared via TicketStore!"));
    $m.on('click', '.jq-del', function() {
        const id = $(this).data('id');
        TicketStore.remove(id);
        refresh();
    });
    refresh();
}

/**
 * 5. TAB CONTROLLER
 */
function switchTab(framework) {
    const mount = document.getElementById('mount-point');
    mount.innerHTML = '';
    if (framework === 'react') ReactDOM.createRoot(mount).render(React.createElement(ReactApp));
    if (framework === 'vue') Vue.createApp(VueApp).mount(mount);
    if (framework === 'jquery') renderJQuery();
    if (framework === 'angular') mount.innerHTML = '<div class="alert alert-info">Angular 17 standalone component would be rendered here in a build-environment. Use React or Vue tabs for full logic.</div>';
}

document.querySelectorAll('[data-framework]').forEach(link => {
    link.addEventListener('click', (e) => {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        e.target.classList.add('active');
        switchTab(e.target.dataset.framework);
    });
});

// Start
switchTab('react');
</script>
</body>
</html>
