<div class="container-fluid">
  @if (view() === 'list') {
    <button class="btn btn-primary mb-3" (click)="openForm()">Add Ticket (Angular)</button>
    <table class="table">
      <thead><tr><th>Summary</th><th>Assignee</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        @for (t of service.tickets(); track t.id) {
          <tr>
            <td>{{ t.summary }}</td>
            <td>{{ t.assignee }}</td>
            <td>
              <select class="form-select form-select-sm d-inline-block w-auto" [value]="t.status" (change)="changeStatus(t, $any($event.target).value)">
                @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
              </select>
            </td>
            <td>
              <button class="btn btn-sm btn-link" (click)="openForm(t)">Edit</button>
              <button class="btn btn-sm btn-link text-danger" (click)="confirmDelete(t.id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <div class="card p-3">
      <div class="mb-2">
        <label for="summaryInput" class="form-label"><strong>Summary</strong></label>
        <input id="summaryInput" class="form-control" placeholder="Summary" [(ngModel)]="formModel().summary" required maxlength="50">
      </div>
      <div class="mb-2">
        <label for="descriptionInput" class="form-label"><strong>Description</strong></label>
        <textarea id="descriptionInput" class="form-control" placeholder="Description" [(ngModel)]="formModel().description" required maxlength="500"></textarea>
      </div>
      <div class="rich-preview mb-2" [innerHTML]="descriptionPreview()"></div>
      <div class="mb-3">
        <label for="assigneeSelect" class="form-label"><strong>Assignee</strong></label>
        <select id="assigneeSelect" class="form-select" [(ngModel)]="formModel().assignee" required>
          <option value="">Select assignee</option>
          @for (name of assignees; track name) { <option [value]="name">{{name}}</option> }
        </select>
      </div>
      <div class="mb-3">
        <label for="statusSelect" class="form-label"><strong>Status</strong></label>
        <select id="statusSelect" class="form-select" [(ngModel)]="formModel().status" required>
          @for (s of statuses; track s) { <option [value]="s">{{s}}</option> }
        </select>
      </div>
      <div>
        <button class="btn btn-success me-2" (click)="onSave()">Save</button>
        <button class="btn btn-light" (click)="view.set('list')">Cancel</button>
      </div>
    </div>
  }
</div>
