<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="chatbot.js"></script>
</head>
<body>
    <div class="container py-3">Ask questions about the author or this website. e.g., 
        <ul>
            <li>What is your experience with Java and Spring?</li>
            <li>Is this person a good fit for this role (paste job description)?</li>
            <li>Tell me about this website.</li>
        </ul>
        <textarea id="chatbotQuestion" class="w-100 h-25" placeholder="Please enter a question."></textarea>
        <button id="askChatbot" class="btn btn-primary mt-2">Ask Me</button>
        <div id="chatbotResponse" class="rich-preview mt-2 text-pre-wrap d-none"></div>
    </div>
    <script>
        (() => {
            const healthUrl = "https://bikehike-github-io.onrender.com/health";

            async function checkHealth() {
            try {
                const response = await fetch(healthUrl, {
                method: "GET",
                cache: "no-store"
                });

                console.log(
                `[Health Check ${new Date().toLocaleTimeString()}]`,
                response.ok ? "Online" : `HTTP ${response.status}`
                );
            } catch (error) {
                console.error("[Health Check] Failed:", error);
            }
            }

            checkHealth(); // Run immediately
            setInterval(checkHealth, 30_000); // Repeat every 30 seconds
        })();
    </script>
</body>
</html>
