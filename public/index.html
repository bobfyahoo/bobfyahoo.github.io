<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Tickets</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tab-container { border: 1px solid #dee2e6; border-top: none; padding: 20px; background: #fff; min-height: 500px; }
        .rich-preview { border: 1px solid #ddd; padding: 10px; background: #f9f9f9; min-height: 60px; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <ul class="nav nav-tabs" id="frameworkTabs">
            <li class="nav-item"><a class="nav-link active" data-framework="react">React</a></li>
            <li class="nav-item"><a class="nav-link" data-framework="reactvite">React Vite</a></li>
            <li class="nav-item"><a class="nav-link" data-framework="angular">Angular 17</a></li>
            <!-- <li class="nav-item"><a class="nav-link" data-framework="vue">Vue</a></li> -->
            <li class="nav-item"><a class="nav-link" data-framework="vuevite">Vue Vite</a></li>
            <li class="nav-item"><a class="nav-link" data-framework="jquery">jQuery</a></li>
        </ul>
        <div id="mount-point" class="tab-container"></div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-body">Are you sure you want to remove item?</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" id="globalConfirmDelete">Remove</button>
            </div>
        </div></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="shared-store.js"></script>
    <script src="react/react-logic.js"></script>
    <script src="vue/js/vue-logic.js"></script>
    <script src="jquery/js/jquery-logic.js"></script>
    <script>
        const mount = document.getElementById('mount-point');
        function switchTab(name) {
            mount.innerHTML = '';
            if(name === 'react') ReactDOM.createRoot(mount).render(React.createElement(ReactTab));
            if(name === 'jquery') JQueryTab.init('#mount-point');
            if(name === 'angular') mount.innerHTML = `<iframe src="./angular/index.html" style="width:100%; height:600px; border:none;"></iframe>`;
            if(name === 'reactvite') mount.innerHTML = `<iframe src="./react.html" style="width:100%; height:600px; border:none;"></iframe>`;
            if(name === 'vuevite') mount.innerHTML = `<iframe src="./vue.html" style="width:100%; height:600px; border:none;"></iframe>`;
            if(name === 'vue') {
                const app = Vue.createApp(VueTab);
                try { app.unmount(); } catch(e) {}
                app.mount(mount);
            }
        }
        document.querySelectorAll('.nav-link').forEach(link => {
            link.onclick = (e) => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                e.target.classList.add('active');
                switchTab(e.target.dataset.framework);
            };
        });
        switchTab('react');
    </script>
</body>
</html>
